async function pickCompare(id){let p=photoCache.find(x=>x.id===id);if(!p)return;let same=photoCache.filter(x=>x.category===p.category&&x.id!==id).sort((a,b)=>a.date.localeCompare(b.date));if(!same.length){toast("Adicione outra foto da mesma categoria para comparar");return}let other=same[0],first=p.date<=other.date?p:other,second=p.date<=other.date?other:p;document.getElementById("compareBox").innerHTML=`<div class="section-title"><h3>Comparação · ${esc(first.category)}</h3><button class="secondary" onclick="exportCompare('${first.id}','${second.id}')">📸 Exportar comparação</button></div><div class="compare-grid"><div><div class="small" style="margin-bottom:6px">${new Date(first.date+"T12:00:00").toLocaleDateString("pt-BR")}</div><img src="${first.data}" alt="Antes"></div><div><div class="small" style="margin-bottom:6px">${new Date(second.date+"T12:00:00").toLocaleDateString("pt-BR")}</div><img src="${second.data}" alt="Depois"></div></div>`;document.getElementById("compareBox").scrollIntoView({behavior:"smooth"})}
async function exportCompare(a,b){let A=photoCache.find(x=>x.id===a),B=photoCache.find(x=>x.id===b);if(!A||!B)return;let [ia,ib]=await Promise.all([loadImage(A.data),loadImage(B.data)]),c=document.createElement("canvas"),ctx=c.getContext("2d"),w=1200,h=700;c.width=w;c.height=h;ctx.fillStyle="#f7f2ef";ctx.fillRect(0,0,w,h);ctx.fillStyle="#765d6d";ctx.font="bold 30px Arial";ctx.fillText("MEU TREINO · EVOLUÇÃO",50,55);ctx.font="18px Arial";ctx.fillStyle="#3f3540";ctx.fillText(A.category,50,88);drawContain(ctx,ia,50,115,540,510);drawContain(ctx,ib,610,115,540,510);ctx.fillText(new Date(A.date+"T12:00:00").toLocaleDateString("pt-BR"),50,665);ctx.fillText(new Date(B.date+"T12:00:00").toLocaleDateString("pt-BR"),610,665);downloadBlob(c.toDataURL("image/png"),`evolucao-${A.category}-${A.date}-${B.date}.png`,`image/png`,true)}
function loadImage(src){return new Promise((res,rej)=>{let im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=src})}function drawContain(ctx,img,x,y,w,h){let s=Math.min(w/img.width,h/img.height),nw=img.width*s,nh=img.height*s;ctx.drawImage(img,x+(w-nw)/2,y+(h-nh)/2,nw,nh)}

function shareTextOrCopy(title,text){try{if(navigator.share){return navigator.share({title,text}).then(()=>toast('Compartilhado 🌷'))}if(navigator.clipboard){navigator.clipboard.writeText(text);toast('Texto copiado para compartilhar.');return Promise.resolve()}window.prompt('Copie para compartilhar:',text);return Promise.resolve()}catch(e){if(e?.name!=='AbortError')toast('Não foi possível compartilhar agora.');return Promise.resolve()}}
function evolutionData(){
 const measures=Object.values(db.measurements||{}).filter(x=>x&&x.date).sort((a,b)=>a.date.localeCompare(b.date));
 const records=Object.entries(db.records||{});
 const runsHist=records.filter(([,r])=>r.run?.km).map(([date,r])=>({date,km:+r.run.km,time:r.run.time||'',pace:fmtPace(r.run.km,r.run.time)})).sort((a,b)=>a.date.localeCompare(b.date));
 const strengthHist=records.filter(([,r])=>r.workout?.finished).map(([date,r])=>({date,vol:dailyStats(date).vol,sets:dailyStats(date).sets})).sort((a,b)=>a.date.localeCompare(b.date));
 return {measures,runsHist,strengthHist};
}

function exerciseTitleForDate(d,i){
 let dow=new Intl.DateTimeFormat("pt-BR",{weekday:"long"}).format(new Date(d+"T12:00:00"));
 let title={"segunda-feira":"Segunda — Costas e ombros","terça-feira":"Terça — Glúteos e posterior de coxa","quarta-feira":"Quarta — Abdômen e core","quinta-feira":"Quinta — Quadríceps e glúteos","sexta-feira":"Sexta — Costas, ombros e abdômen"}[dow];
 return title&&strength[title]?.[+i]?.[0]||`Exercício ${+i+1}`;
}
function exportCSV(){

 Object.entries(db.records).sort().forEach(([d,r])=>{
  let w=weekForDate(d), ex=Object.entries(r.ex||{});
  if(!ex.length){
   rows.push([d,w,phases(w),"","","","","","",r.run?.km||"",r.run?.time||"",fmtPace(r.run?.km,r.run?.time),r.dance||"",r.energy||"",r.rpe||"",r.pain||"",r.notes||""]);

  ['🏃','Primeiros 5 km',runs.some(r=>+r.run.km>=4.7&&+r.run.km<=5.3)],
  ['🏋️','10 treinos de força',strengthCount>=10],

function lineChartSVG(data,unit,reverse=false){
 if(data.length<2)return `<div class="mutedbox">Registre pelo menos dois registros para visualizar a tendência.</div>`;
 const W=760,H=220,L=46,R=18,T=16,B=34,vals=data.map(x=>x.v),min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;
 const pts=data.map((x,i)=>{const px=L+(i*(W-L-R)/(data.length-1));const py=T+(H-T-B)*((max-x.v)/span);return {x:px,y:py,label:x.label,v:x.v}});
 const poly=pts.map(p=>`${p.x},${p.y}`).join(' ');
 const circles=pts.map(p=>`<circle class="evo-dot" cx="${p.x}" cy="${p.y}" r="4"><title>${esc(p.label)} · ${p.v}${unit}</title></circle>`).join('');
 const labels=pts.map((p,i)=>i===0||i===pts.length-1||i===Math.floor(pts.length/2)?`<text class="evo-label" x="${p.x}" y="${H-8}" text-anchor="middle">${esc(p.label)}</text>`:'').join('');
 return `<svg class="evo-svg" viewBox="0 0 ${W} ${H}" role="img"><line class="evo-axis" x1="${L}" y1="${T}" x2="${L}" y2="${H-B}"/><line class="evo-axis" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/><polyline class="evo-line" points="${poly}"/>${circles}${labels}<text class="evo-label" x="8" y="${T+5}">${max.toFixed(1)}${unit}</text><text class="evo-label" x="8" y="${H-B}">${min.toFixed(1)}${unit}</text></svg>`;
}

function updateBodyChartHTML(metric,measures){const map={weight:['Peso','kg'],waist:['Cintura','cm'],hip:['Quadril','cm'],thigh:['Coxa','cm'],arm:['Braço','cm']};const arr=measures.filter(x=>x[metric]!==''&&x[metric]!=null&&isFinite(+x[metric])).slice(-12).map(x=>({v:+x[metric],label:fmtDateBR(x.date)}));return lineChartSVG(arr,map[metric][1]);}
function updateBodyChart(){const box=document.getElementById('v26BodyChart'),sel=document.getElementById('v26BodyMetric');if(box&&sel)box.innerHTML=updateBodyChartHTML(sel.value,(db.measures||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)))}
function enhanceMoreV26(){
 const more=document.getElementById('more');if(!more)return;const old=more.querySelector('.v26-more');if(old)old.remove();const g=db.goals||{};
 const html=`<div class="section-title v26-more"><h3>🎯 Metas detalhadas</h3><span class="small">acompanhe seu progresso pessoal</span></div><div class="card v26-more"><div class="grid3"><div><label>5 km — meta</label><input id="v26gRun" value="${esc(g.run5k||'30:00')}" onchange="saveGoal('run5k',this.value)"><div class="small" style="margin-top:5px">Tempo-alvo</div></div><div><label>Elevação pélvica</label><input id="v26gHip" type="number" value="${g.hip||100}" onchange="saveGoal('hip',+this.value)"><div class="small" style="margin-top:5px">kg-alvo</div></div><div><label>Km semanais</label><input id="v26gKm" type="number" value="${g.weeklyKm||30}" onchange="saveGoal('weeklyKm',+this.value)"><div class="small" style="margin-top:5px">meta de volume</div></div></div><div class="mutedbox" style="margin-top:12px">As metas são comparadas somente com seus próprios registros. Nada aqui é uma avaliação de desempenho externo.</div></div><div class="section-title v26-more"><h3>📱 Instalação</h3></div><div class="install-card v26-more"><b>Instale o Meu Treino no celular</b><p class="small">Quando estiver publicado em HTTPS, o navegador poderá oferecer a instalação como aplicativo. Os dados continuam salvos no dispositivo.</p><button class="secondary" onclick="installApp()">＋ Instalar aplicativo</button></div>`;
 more.insertAdjacentHTML('beforeend',html);
}
let deferredInstallPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e});async function installApp(){if(!deferredInstallPrompt){toast('A instalação aparece pelo navegador quando o app estiver em HTTPS.');return}deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(e){}deferredInstallPrompt=null}
